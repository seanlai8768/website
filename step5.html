<html>
<head>
    <title>計算機</title>
</head>
<body>
<h1 style="font-size:60px;">計算機</h1>
<a href="./index.html">

    <form name='form' id='form'>
            <input type='text'name='a'  id='a'  value=33 onclick=''/> 
            <input type='button'name='submit'   id='submit' value='+'onclick='
            processFormData()'/>
            <input type='button'name='submit'   id='submit' value='-'onclick='processFormDat()'/>
            <input type='button'name='submit'   id='submit' value='x'onclick='processFormDa()'/>
            <input type='button'name='submit'   id='submit' value='/'onclick='processFormD()'/>
            <input type='text'name='b'  id='b'  value=22 onclick=''/> 
            
        </form>
        <input type='text' name='an' id='an'disabled />
        <input type='text' name='ans' id='ans'disabled />
        <input type='text' name='answ' id='answ'disabled />
        <input type='text' name='answe' id='answe'disabled />
    </body>
    <script>
        

        function processFormData(){
            const aElement=document.getElementById("a");
            const a=parseInt(aElement.value);

            const bElement=document.getElementById("b");
            const b=parseInt(bElement.value);

            resu=a+b
            
            const anElement=document.getElementById("an");
            anElement.value=resu;
            

        }
       function processFormDat(){
            const aElement=document.getElementById("a");
            const a=parseInt(aElement.value);

            const bElement=document.getElementById("b");
            const b=parseInt(bElement.value);

        resul=a-b
            
            const ansElement=document.getElementById("ans");
            ansElement.value=resul;
            
        }
        function processFormDa(){
            const aElement=document.getElementById("a");
            const a=parseInt(aElement.value);

            const bElement=document.getElementById("b");
            const b=parseInt(bElement.value);
            result=a*b
            
            const answElement=document.getElementById("answ");
            answElement.value=result;
            
        }
        function processFormD(){
            const aElement=document.getElementById("a");
            const a=parseInt(aElement.value);

            const bElement=document.getElementById("b");
            const b=parseInt(bElement.value);

        resultt=a/b
            
            const answeElement=document.getElementById("answe");
            answeElement.value=resultt;
        }
    </script>
